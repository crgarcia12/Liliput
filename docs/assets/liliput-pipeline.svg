<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title description">
  <title id="title">Liliput observable software delivery pipeline</title>
  <desc id="description">An animated pipeline showing intent moving through an isolated workspace, an agent, tests, preview deployment, review, and a pull request, with an evidence log beneath it.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="55%" stop-color="#0a0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="48%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1019"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text {
      font-family: "SFMono-Regular", "Cascadia Code", "Liberation Mono", Consolas, monospace;
    }

    .flow-line {
      animation: move-dashes 3.5s linear infinite;
    }

    .node-ring {
      animation: node-pulse 3.5s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .delay-1 { animation-delay: 0.35s; }
    .delay-2 { animation-delay: 0.7s; }
    .delay-3 { animation-delay: 1.05s; }
    .delay-4 { animation-delay: 1.4s; }
    .delay-5 { animation-delay: 1.75s; }
    .delay-6 { animation-delay: 2.1s; }

    .event {
      animation: event-cycle 8s ease-in-out infinite;
    }

    .event-2 { animation-delay: 1.2s; }
    .event-3 { animation-delay: 2.4s; }
    .event-4 { animation-delay: 3.6s; }

    .cursor {
      animation: blink 1s steps(1, end) infinite;
    }

    @keyframes move-dashes {
      to { stroke-dashoffset: -120; }
    }

    @keyframes node-pulse {
      0%, 70%, 100% { opacity: 0.25; transform: scale(1); }
      15% { opacity: 0.9; transform: scale(1.18); }
    }

    @keyframes event-cycle {
      0%, 8% { opacity: 0.18; }
      16%, 68% { opacity: 1; }
      82%, 100% { opacity: 0.18; }
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow-line,
      .node-ring,
      .event,
      .cursor {
        animation: none;
      }
    }
  </style>

  <rect width="1400" height="520" rx="26" fill="url(#background)"/>
  <rect width="1400" height="520" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1398" height="518" rx="25" fill="none" stroke="#273449" stroke-width="2"/>

  <text x="70" y="42" fill="#64748b" font-size="14" font-weight="700" letter-spacing="2">LILIPUT / EXECUTION CONTROL PLANE</text>
  <circle cx="1305" cy="36" r="5" fill="#34d399" filter="url(#glow)"/>
  <text x="1320" y="41" fill="#94a3b8" font-size="13">LIVE</text>

  <rect x="70" y="64" width="820" height="92" rx="14" fill="url(#panel)" stroke="#26354b"/>
  <text x="94" y="91" fill="#22d3ee" font-size="12" font-weight="800" letter-spacing="1.5">INTENT</text>
  <text x="94" y="126" fill="#f8fafc" font-size="20" font-weight="700">Add a repository-scoped feature and ship it safely.</text>
  <rect class="cursor" x="790" y="106" width="11" height="24" rx="2" fill="#22d3ee"/>

  <rect x="920" y="64" width="410" height="92" rx="14" fill="url(#panel)" stroke="#26354b"/>
  <text x="944" y="91" fill="#64748b" font-size="12" font-weight="800" letter-spacing="1.5">EXECUTION STATE</text>
  <text x="944" y="126" fill="#34d399" font-size="18" font-weight="800">RUNNING / INTERRUPTIBLE</text>

  <path d="M 126 246 H 1274" fill="none" stroke="#1f2c3d" stroke-width="8" stroke-linecap="round"/>
  <path class="flow-line" d="M 126 246 H 1274" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="16 24"/>

  <circle r="7" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 126 246 H 1274"/>
  </circle>

  <g transform="translate(126 246)">
    <circle class="node-ring" r="31" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle r="20" fill="#0e2630" stroke="#22d3ee" stroke-width="2"/>
    <text x="0" y="60" fill="#e2e8f0" font-size="14" font-weight="800" text-anchor="middle">INTENT</text>
    <text x="0" y="79" fill="#64748b" font-size="11" text-anchor="middle">task</text>
  </g>

  <g transform="translate(317 246)">
    <circle class="node-ring delay-1" r="31" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle r="20" fill="#10243a" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="60" fill="#e2e8f0" font-size="14" font-weight="800" text-anchor="middle">WORKSPACE</text>
    <text x="0" y="79" fill="#64748b" font-size="11" text-anchor="middle">clone + branch</text>
  </g>

  <g transform="translate(508 246)">
    <circle class="node-ring delay-2" r="31" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <circle r="20" fill="#14233d" stroke="#60a5fa" stroke-width="2"/>
    <text x="0" y="60" fill="#e2e8f0" font-size="14" font-weight="800" text-anchor="middle">AGENT</text>
    <text x="0" y="79" fill="#64748b" font-size="11" text-anchor="middle">tools + code</text>
  </g>

  <g transform="translate(700 246)">
    <circle class="node-ring delay-3" r="31" fill="none" stroke="#818cf8" stroke-width="2"/>
    <circle r="20" fill="#1b2140" stroke="#818cf8" stroke-width="2"/>
    <text x="0" y="60" fill="#e2e8f0" font-size="14" font-weight="800" text-anchor="middle">TESTS</text>
    <text x="0" y="79" fill="#64748b" font-size="11" text-anchor="middle">evidence</text>
  </g>

  <g transform="translate(892 246)">
    <circle class="node-ring delay-4" r="31" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <circle r="20" fill="#251e42" stroke="#a78bfa" stroke-width="2"/>
    <text x="0" y="60" fill="#e2e8f0" font-size="14" font-weight="800" text-anchor="middle">PREVIEW</text>
    <text x="0" y="79" fill="#64748b" font-size="11" text-anchor="middle">ACR + AKS</text>
  </g>

  <g transform="translate(1083 246)">
    <circle class="node-ring delay-5" r="31" fill="none" stroke="#c084fc" stroke-width="2"/>
    <circle r="20" fill="#2a1c3c" stroke="#c084fc" stroke-width="2"/>
    <text x="0" y="60" fill="#e2e8f0" font-size="14" font-weight="800" text-anchor="middle">REVIEW</text>
    <text x="0" y="79" fill="#64748b" font-size="11" text-anchor="middle">verdict</text>
  </g>

  <g transform="translate(1274 246)">
    <circle class="node-ring delay-6" r="31" fill="none" stroke="#e879f9" stroke-width="2"/>
    <circle r="20" fill="#331c3b" stroke="#e879f9" stroke-width="2"/>
    <text x="0" y="60" fill="#e2e8f0" font-size="14" font-weight="800" text-anchor="middle">PULL REQUEST</text>
    <text x="0" y="79" fill="#64748b" font-size="11" text-anchor="middle">human gate</text>
  </g>

  <rect x="70" y="350" width="1260" height="116" rx="14" fill="url(#panel)" stroke="#26354b"/>
  <rect x="70" y="350" width="5" height="116" rx="2" fill="url(#flow)"/>
  <text x="96" y="378" fill="#64748b" font-size="12" font-weight="800" letter-spacing="1.5">LIVE EVIDENCE</text>

  <g class="event">
    <text x="96" y="407" fill="#475569" font-size="13">16:08:21</text>
    <text x="190" y="407" fill="#60a5fa" font-size="13" font-weight="700">agent.coder</text>
    <text x="330" y="407" fill="#cbd5e1" font-size="13">commit ready</text>
  </g>
  <g class="event event-2">
    <text x="96" y="433" fill="#475569" font-size="13">16:08:37</text>
    <text x="190" y="433" fill="#818cf8" font-size="13" font-weight="700">test.runner</text>
    <text x="330" y="433" fill="#cbd5e1" font-size="13">project checks green</text>
  </g>
  <g class="event event-3">
    <text x="650" y="407" fill="#475569" font-size="13">16:09:14</text>
    <text x="744" y="407" fill="#a78bfa" font-size="13" font-weight="700">deployer</text>
    <text x="856" y="407" fill="#cbd5e1" font-size="13">preview healthy / HTTP 200</text>
  </g>
  <g class="event event-4">
    <text x="650" y="433" fill="#475569" font-size="13">16:09:16</text>
    <text x="744" y="433" fill="#e879f9" font-size="13" font-weight="700">reviewer</text>
    <text x="856" y="433" fill="#cbd5e1" font-size="13">evidence attached / human decision pending</text>
  </g>

  <text x="70" y="495" fill="#475569" font-size="12">STATE: DURABLE</text>
  <text x="220" y="495" fill="#475569" font-size="12">TOOLS: VISIBLE</text>
  <text x="370" y="495" fill="#475569" font-size="12">FAILURES: EXPLICIT</text>
  <text x="565" y="495" fill="#475569" font-size="12">CONTROL: HUMAN</text>
</svg>
