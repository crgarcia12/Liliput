name: Deploy Liliput (AKS)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'k8s/**'
      - '.github/workflows/deploy-liliput.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RG: crgar-liliput-rg
  AKS: crgar-liliput-aks
  ACR: crgarliliputacr
  ACR_LOGIN_SERVER: crgarliliputacr.azurecr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'src/api/**'
              - 'src/shared/**'
              - 'k8s/**'
              - '.github/workflows/deploy-liliput.yml'
            web:
              - 'src/web/**'
              - 'src/shared/**'
              - 'k8s/**'
              - '.github/workflows/deploy-liliput.yml'

      - name: Compute build flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_api=true"  >> "$GITHUB_OUTPUT"
            echo "build_web=true"  >> "$GITHUB_OUTPUT"
          else
            echo "build_api=${{ steps.changes.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "build_web=${{ steps.changes.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi
          echo "API build: ${{ steps.changes.outputs.api }} | Web build: ${{ steps.changes.outputs.web }} | event: ${{ github.event_name }}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build API image
        if: steps.flags.outputs.build_api == 'true'
        run: |
          az acr build \
            --registry $ACR \
            --image "liliput-api:${{ github.sha }}" \
            --image "liliput-api:latest" \
            --file src/api/Dockerfile \
            .

      - name: Build Web image
        if: steps.flags.outputs.build_web == 'true'
        run: |
          az acr build \
            --registry $ACR \
            --image "liliput-web:${{ github.sha }}" \
            --image "liliput-web:latest" \
            --file src/web/Dockerfile \
            .

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RG }}
          cluster-name: ${{ env.AKS }}

      - name: Sync Copilot GitHub token secret
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
        run: |
          # Ensure the namespace exists before applying the manifest below
          kubectl create namespace liliput --dry-run=client -o yaml | kubectl apply -f -

          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::warning::COPILOT_GITHUB_TOKEN secret is not set. The API will start without LLM access; the UI will show an auth banner."
          fi
          if [ -z "$GITHUB_WEBHOOK_SECRET" ]; then
            echo "::warning::GITHUB_WEBHOOK_SECRET secret is not set — webhook router will not mount; loop falls back to polling."
          fi
          kubectl -n liliput create secret generic liliput-secrets \
            --from-literal=COPILOT_GITHUB_TOKEN="$COPILOT_GITHUB_TOKEN" \
            --from-literal=GITHUB_WEBHOOK_SECRET="$GITHUB_WEBHOOK_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render manifest
        run: |
          # The manifest uses __NS__ / __DEV_PREFIX__ placeholders so the same
          # template can deploy multiple instances (e.g. liliput + liliput-dev).
          sed -e "s|__NS__|liliput|g" \
              -e "s|__DEV_PREFIX__|dev|g" \
              -e "s|__ENV_NAME__|PROD|g" \
              -e "s|__PUBLIC_BASE_URL__|https://liliput.crgarcia.com.ar|g" \
              -e "s|__PIP_NAME__|liliput-test-pip|g" \
              -e "s|__LB_IP__|4.223.107.121|g" \
              -e "s|__RESOLVER_IP__|10.0.0.10|g" \
              k8s/liliput.yaml > k8s/liliput.rendered.yaml

      - name: Deploy to AKS
        env:
          BUILD_API: ${{ steps.flags.outputs.build_api }}
          BUILD_WEB: ${{ steps.flags.outputs.build_web }}
        run: |
          kubectl apply -f k8s/liliput.rendered.yaml
          # TLS termination: nginx ingress + cert-manager front the gateway.
          # The gateway Service is patched to ClusterIP (the LoadBalancer-typed
          # template would otherwise keep recreating a redundant public LB).
          kubectl apply -f k8s/liliput-tls.yaml
          kubectl -n liliput patch svc liliput-gateway --type=json -p='[
            {"op":"replace","path":"/spec/type","value":"ClusterIP"},
            {"op":"remove","path":"/spec/loadBalancerIP"},
            {"op":"remove","path":"/metadata/annotations/service.beta.kubernetes.io~1azure-load-balancer-resource-group"},
            {"op":"remove","path":"/metadata/annotations/service.beta.kubernetes.io~1azure-pip-name"}
          ]' 2>/dev/null || true
          if [ "$BUILD_API" = "true" ]; then
            kubectl -n liliput set image deployment/liliput-api \
              api=$ACR_LOGIN_SERVER/liliput-api:${{ github.sha }}
          else
            echo "Skipping API image update — no API/shared changes."
          fi
          if [ "$BUILD_WEB" = "true" ]; then
            kubectl -n liliput set image deployment/liliput-web \
              web=$ACR_LOGIN_SERVER/liliput-web:${{ github.sha }}
          else
            echo "Skipping Web image update — no Web/shared changes."
          fi
          # Pick up secret changes even when the API image SHA didn't change.
          # Only restart when API was rebuilt OR when secrets/manifests changed —
          # avoid bouncing the API on web-only deploys.
          if [ "$BUILD_API" = "true" ]; then
            kubectl -n liliput rollout restart deployment/liliput-api
          fi

      - name: Wait for rollout
        run: |
          set +e
          kubectl -n liliput rollout status deployment/liliput-api --timeout=5m
          API_RC=$?
          kubectl -n liliput rollout status deployment/liliput-web --timeout=5m
          WEB_RC=$?
          kubectl -n liliput rollout status deployment/liliput-gateway --timeout=5m
          GW_RC=$?
          if [ $API_RC -ne 0 ] || [ $WEB_RC -ne 0 ] || [ $GW_RC -ne 0 ]; then
            echo "::group::Diagnostics"
            kubectl -n liliput get pods -o wide
            kubectl -n liliput get events --sort-by='.lastTimestamp' | tail -30
            kubectl -n liliput logs -l app=liliput-api --tail=50 2>/dev/null || true
            kubectl -n liliput logs -l app=liliput-web --tail=50 2>/dev/null || true
            kubectl -n liliput describe pod -l app=liliput-api 2>/dev/null | tail -40 || true
            kubectl -n liliput describe pod -l app=liliput-web 2>/dev/null | tail -40 || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Get service URL
        run: |
          {
            echo "### Liliput Deployed ✅"
            echo ""
            echo "- **Liliput URL: https://liliput.crgarcia.com.ar**"
            echo "- Image tag: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
