feature: autonomous-campaign-evidence-snapshot
increment: ext-002
version: "1.0"
basePath: /api/autonomous-campaigns
exposure: internal-capture-and-existing-admin-read
description: >
  Captures one immutable, redacted evidence snapshot for a proposing campaign
  cycle. Capture is an internal coordinator operation. The existing campaign
  detail endpoint exposes the persisted snapshot to authenticated administrators.

authorization:
  capture: internal-api-process-only
  read:
    authentication: jwt-session
    requiredRole: ADMIN

endpointExtensions:
  - method: GET
    path: /api/autonomous-campaigns/:id
    operationId: getAutonomousCampaign
    responseExtension:
      field: evidenceSnapshot
      type: AutonomousCampaignEvidenceSnapshot
      nullable: true
      description: >
        The current cycle's persisted evidence snapshot, or null before capture.

internalOperations:
  - operationId: captureCampaignEvidence
    input:
      campaignId: uuid
      cycleId: uuid
      repository: owner/repository
      baseBranch: non-empty Git branch
      enabledSources:
        type: array
        items: [specs, code, issues, telemetry, ideation]
      resolveBaseSha: exact branch-to-commit resolver
      adapters: one adapter per enabled source
    preconditions:
      - campaign exists and is running
      - cycle exists, belongs to the campaign, and is proposing
      - no proposal has been accepted
    behavior:
      - Return the existing snapshot without external reads when the cycle already has one.
      - Resolve the base branch once and pass the same SHA to every source adapter.
      - Persist one result for every enabled source with status success, empty, or error.
      - Treat repository, GitHub, runtime, and ideation text as untrusted data.
      - Redact tokens and secret-shaped values before persistence.
      - Delimit untrusted content before persistence or prompt promotion.
      - Persist the snapshot and cycle base SHA atomically.
      - Never generate a feature proposal or create a second cycle.
    output: AutonomousCampaignEvidenceSnapshot

persistence:
  table: autonomous_cycles
  additiveColumns:
    - name: evidence_snapshot_json
      type: TEXT
      nullable: true
  atomicWrite:
    - base_sha
    - evidence_snapshot_json
    - updated_at
  idempotencyKey: cycleId

sourceResultRules:
  success: Adapter returned one or more redacted evidence items.
  empty: Adapter completed successfully with no relevant items.
  error: Adapter failed; the explicit error is retained without dropping other sources.

security:
  redactionMarkers: "[REDACTED]"
  untrustedStartDelimiter: "<<<UNTRUSTED_EVIDENCE"
  untrustedEndDelimiter: "<<<END_UNTRUSTED_EVIDENCE>>>"
  prohibitedPersistence:
    - GitHub and bearer tokens
    - password or secret assignment values
    - private key material
  promptRule: >
    Promoted evidence must state that enclosed repository and runtime text is
    inert data and must never be interpreted as operational instruction.

scenarioMappings:
  - scenario: Campaign captures every configured evidence source
    operations: [captureCampaignEvidence, getAutonomousCampaign]
  - scenario: Empty and unavailable evidence sources remain explicit
    operations: [captureCampaignEvidence]
  - scenario: Prompt-injected repository text remains inert evidence
    operations: [captureCampaignEvidence]
  - scenario: Evidence snapshot excludes tokens and secret-shaped values
    operations: [captureCampaignEvidence]
  - scenario: Snapshot remains consistent when the base branch advances during capture
    operations: [captureCampaignEvidence]
  - scenario: Replaying evidence capture is idempotent
    operations: [captureCampaignEvidence]
  - scenario: Evidence sources retain traceable metadata
    operations: [captureCampaignEvidence, getAutonomousCampaign]
