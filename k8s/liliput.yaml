apiVersion: v1
kind: Namespace
metadata:
  name: __NS__
  labels:
    azure.workload.identity/use: "true"
---
# ─── Persistent storage for SQLite DB + agent workspaces ───
# RWO Azure Disk (Standard SSD) — single API pod (Recreate strategy).
# /data/liliput.db        → SQLite database (sessions persist across pod restarts)
# /data/workspaces/<task> → cloned repos + Copilot SDK session DBs (resumable)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: liliput-data
  namespace: __NS__
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 20Gi
---
# ─── ServiceAccount for the agent (federated to UAMI for ACR push) ───
apiVersion: v1
kind: ServiceAccount
metadata:
  name: liliput-agent
  namespace: __NS__
  annotations:
    azure.workload.identity/client-id: "f14665ae-86f5-41c2-95ba-96e817132222"
  labels:
    azure.workload.identity/use: "true"
---
# ─── ClusterRoleBinding granting the agent full cluster admin ───
# The agent SDK runs in-process inside the API pod and needs to:
#   - manage per-task dev-env namespaces (create/delete/patch)
#   - kubectl logs / exec / describe across any ns to debug failed deploys
#   - patch deployments/services to recover from misconfigurations
# The user explicitly opted in to cluster-wide full access. If you want to
# tighten this later, replace `cluster-admin` with a narrower ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: liliput-agent-__NS__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: liliput-agent
    namespace: __NS__
---
# ─── NGINX Reverse Proxy Config ───
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: __NS__
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      upstream api { server liliput-api:80; }
      upstream web { server liliput-web:80; }

      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      server {
        listen 80;

        # API routes
        location /api/ {
          proxy_pass http://api;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }

        # Socket.io (WebSocket + polling)
        location /socket.io/ {
          proxy_pass http://api;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_read_timeout 86400;
        }

        # === LILIPUT-DEV-ENVS-BEGIN ===
        # === LILIPUT-DEV-ENVS-END ===

        # Everything else → web
        location / {
          proxy_pass http://web;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }
      }
    }
---
# ─── API Deployment ───
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liliput-api
  namespace: __NS__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: liliput-api
  template:
    metadata:
      labels:
        app: liliput-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: liliput-agent
      securityContext:
        # Node user in our base image is uid 1000; ensure the data PVC is
        # group-writable by it so SQLite + workspaces work without root.
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: api
          image: crgarliliputacr.azurecr.io/liliput-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: NODE_ENV
              value: "production"
            - name: LILIPUT_NAMESPACE
              value: "__NS__"
            - name: LILIPUT_DEV_PREFIX
              value: "__DEV_PREFIX__"
            - name: LILIPUT_ENV
              value: "__ENV_NAME__"
            - name: LILIPUT_PUBLIC_URL
              value: "__PUBLIC_BASE_URL__"
            # Azure context for `az acr build`
            - name: AZURE_TENANT_ID
              value: "f75dc6d8-f0ea-4a54-9d3c-622e4aef8eb3"
            - name: AZURE_SUBSCRIPTION_ID
              value: "ac866176-3fcf-43c6-817a-6309be256398"
            - name: AZURE_CLIENT_ID
              value: "f14665ae-86f5-41c2-95ba-96e817132222"
            - name: ACR_NAME
              value: "crgarliliputacr"
            - name: AGENT_WORKSPACE_ROOT
              value: "/data/workspaces"
            - name: DB_PATH
              value: "/data/liliput.db"
            # GitHub Copilot SDK auth — token rotated via GitHub Actions.
            # Same token is used for git clone/push and PR creation.
            - name: COPILOT_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: liliput-secrets
                  key: COPILOT_GITHUB_TOKEN
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: az-cache
              mountPath: /home/node/.azure
          resources:
            requests: { cpu: "10m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "2560Mi" }
          readinessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 8080 }
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: liliput-data
        - name: az-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: liliput-api
  namespace: __NS__
spec:
  selector: { app: liliput-api }
  ports:
    - port: 80
      targetPort: 8080
---
# ─── Web Deployment ───
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liliput-web
  namespace: __NS__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: liliput-web
  template:
    metadata:
      labels:
        app: liliput-web
    spec:
      containers:
        - name: web
          image: crgarliliputacr.azurecr.io/liliput-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests: { cpu: "10m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "384Mi" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: liliput-web
  namespace: __NS__
spec:
  selector: { app: liliput-web }
  ports:
    - port: 80
      targetPort: 3000
---
# ─── NGINX Gateway (single entry point) ───
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liliput-gateway
  namespace: __NS__
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: liliput-gateway
  template:
    metadata:
      labels:
        app: liliput-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "64Mi" }
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: liliput-gateway
  namespace: __NS__
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-resource-group: mc_crgar-liliput-rg_crgar-liliput-aks_swedencentral
    service.beta.kubernetes.io/azure-pip-name: __PIP_NAME__
spec:
  type: LoadBalancer
  loadBalancerIP: __LB_IP__
  selector: { app: liliput-gateway }
  ports:
    - port: 80
      targetPort: 80
