version: "1.3"
increments: [ext-pre-001, ext-pre-002, ext-001, ext-002]
target: azure-kubernetes-service
description: >
  Durable autonomous campaign state, admin controls, and redacted evidence
  snapshots reuse Liliput's existing API, Web, Socket.IO server, single-writer
  SQLite database, model_pricing table, gateway route, and Azure Disk PVC.
  ext-002 adds no Azure resource, Kubernetes workload, secret, environment
  variable, or external network route.

newResources: []
newEnvironmentVariables: []
newSecrets: []
bicepChangesRequired: false
kubernetesManifestChangesRequired: false

resources:
  - name: aks-cluster
    type: Microsoft.ContainerService/managedClusters
    lifecycle: existing
    description: Hosts the Liliput API, Web, gateway, and persistent volumes.
    sku:
      name: existing
      justification: Campaign persistence and pricing checks do not change cluster capacity requirements.

  - name: container-registry
    type: Microsoft.ContainerRegistry/registries
    lifecycle: existing
    description: Stores the existing Liliput API and Web images.
    sku:
      name: existing
      justification: These prerequisites introduce no new image or retention requirement.

  - name: liliput-api
    type: Kubernetes/apps/v1/Deployment
    lifecycle: existing
    description: Runs the Express API and the single SQLite writer.
    sku:
      name: single-replica
      justification: >
        The existing ReadWriteOnce Azure Disk and SQLite architecture require
        one API replica. Renewable campaign leases protect restart recovery and
        coordinator ownership; they do not enable multi-writer scale-out.
    scaling:
      minReplicas: 1
      maxReplicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2560Mi
    ingress:
      external: false
      servicePort: 8080
      healthPath: /api/health
    env:
      - name: DB_PATH
        value: /data/liliput.db

  - name: liliput-web
    type: Kubernetes/apps/v1/Deployment
    lifecycle: existing
    description: Serves the authenticated /autonomy portal through the existing gateway.
    sku:
      name: existing-single-replica
      justification: The campaign portal adds a lightweight client page and no new capacity requirement.
    scaling:
      minReplicas: 1
      maxReplicas: 1
    ingress:
      external: false
      servicePort: 3000

  - name: liliput-gateway
    type: Kubernetes/apps/v1/Deployment
    lifecycle: existing
    description: Routes /api and Socket.IO traffic to the API and portal traffic to Web.
    sku:
      name: existing-single-replica
      justification: Campaign controls reuse existing HTTP and WebSocket paths.
    ingress:
      external: true
      routes:
        - path: /api/autonomous-campaigns
          target: liliput-api
        - path: /socket.io
          target: liliput-api
        - path: /autonomy
          target: liliput-web

  - name: liliput-data
    type: Kubernetes/v1/PersistentVolumeClaim
    lifecycle: existing
    description: Persists SQLite state and workspaces across API and AKS restarts.
    sku:
      name: managed-csi
      justification: Existing 20Gi ReadWriteOnce Azure Disk is sufficient.
    storage:
      accessModes: [ReadWriteOnce]
      requested: 20Gi
      mountPath: /data

dependencies:
  - from: liliput-api
    to: liliput-data
    reason: Campaign, cycle, evidence snapshot, attempt, lease, transition, and usage data persist in SQLite.
  - from: liliput-api
    to: aks-cluster
    reason: The API deployment runs on the existing AKS cluster.
  - from: liliput-api
    to: container-registry
    reason: The existing API image is pulled from ACR.
  - from: liliput-web
    to: liliput-api
    reason: The Autonomy portal reads and mutates campaign state through authenticated API routes.
  - from: liliput-gateway
    to: liliput-api
    reason: Existing API and Socket.IO routing carries campaign controls and live updates.
  - from: liliput-gateway
    to: liliput-web
    reason: Existing portal routing serves the /autonomy page.

constraints:
  - Campaign schema changes must be additive and backward compatible.
  - Campaign model eligibility must use verified model_pricing rows effective at the check time.
  - Missing campaign pricing must never be interpreted as zero cost.
  - Existing manual tasks may continue to record explicitly unpriced usage.
  - Existing task and workstream tables must remain readable without backfill loss.
  - Evidence snapshot schema changes must be additive and stored on the existing cycle row.
  - Every enabled evidence source must persist an explicit success, empty, or error result.
  - Repository, GitHub, runtime, and ideation text must be redacted and delimited as untrusted before persistence.
  - Every source adapter must read repository content from the single base SHA resolved at capture start.
  - The API deployment must retain Recreate strategy while using the ReadWriteOnce volume.
  - All campaign control routes require authenticated ADMIN role.
  - Starting a campaign in ext-001 must not invoke an LLM or create an attempt.

gaps: []
