name: Deploy Liliput DEV (AKS)

# Manual-only DEV deployment — uses a separate namespace `liliput-dev`
# with its own gateway IP, PVC, and DB. Lets us iterate without touching
# the stable `liliput` namespace.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

env:
  RG: crgar-liliput-rg
  AKS: crgar-liliput-aks
  ACR: crgarliliputacr
  ACR_LOGIN_SERVER: crgarliliputacr.azurecr.io
  NS: liliput-dev
  DEV_PREFIX: devx
  IMAGE_SUFFIX: dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build API image
        run: |
          az acr build \
            --registry $ACR \
            --image "liliput-api-${IMAGE_SUFFIX}:${{ github.sha }}" \
            --image "liliput-api-${IMAGE_SUFFIX}:latest" \
            --file src/api/Dockerfile \
            .

      - name: Build Web image
        run: |
          az acr build \
            --registry $ACR \
            --image "liliput-web-${IMAGE_SUFFIX}:${{ github.sha }}" \
            --image "liliput-web-${IMAGE_SUFFIX}:latest" \
            --file src/web/Dockerfile \
            .

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RG }}
          cluster-name: ${{ env.AKS }}

      - name: Render manifest
        run: |
          sed -e "s|__NS__|${NS}|g" \
              -e "s|__DEV_PREFIX__|${DEV_PREFIX}|g" \
              -e "s|__ENV_NAME__|DEV|g" \
              -e "s|__PUBLIC_BASE_URL__|https://dev.liliput.crgarcia.com.ar|g" \
              -e "s|__PIP_NAME__|liliput-dev-pip|g" \
              -e "s|__LB_IP__|20.240.60.167|g" \
              k8s/liliput.yaml > k8s/liliput.rendered.yaml
          # Swap the image references so DEV pulls dev-tagged images
          sed -i "s|liliput-api:latest|liliput-api-${IMAGE_SUFFIX}:latest|g; s|liliput-web:latest|liliput-web-${IMAGE_SUFFIX}:latest|g" k8s/liliput.rendered.yaml
          # Render the dev-host TLS Ingress for liliput-dev ns
          sed -e "s|liliput.crgarcia.com.ar|dev.liliput.crgarcia.com.ar|g" \
              -e "s|namespace: liliput|namespace: ${NS}|g" \
              k8s/liliput-tls.yaml > k8s/liliput-tls.rendered.yaml

      - name: Sync Copilot GitHub token secret
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          kubectl create namespace ${NS} --dry-run=client -o yaml | kubectl apply -f -
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::warning::COPILOT_GITHUB_TOKEN secret is not set."
            kubectl -n ${NS} create secret generic liliput-secrets \
              --from-literal=COPILOT_GITHUB_TOKEN="" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            kubectl -n ${NS} create secret generic liliput-secrets \
              --from-literal=COPILOT_GITHUB_TOKEN="$COPILOT_GITHUB_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Deploy to AKS
        run: |
          kubectl delete deployments --all -n ${NS} --ignore-not-found 2>/dev/null || true
          kubectl apply -f k8s/liliput.rendered.yaml
          # TLS termination: nginx ingress + cert-manager front the gateway.
          # The gateway Service is patched to ClusterIP (the LoadBalancer-typed
          # template would otherwise keep recreating a redundant public LB).
          kubectl apply -f k8s/liliput-tls.rendered.yaml
          kubectl -n ${NS} patch svc liliput-gateway --type=json -p='[
            {"op":"replace","path":"/spec/type","value":"ClusterIP"},
            {"op":"remove","path":"/spec/loadBalancerIP"},
            {"op":"remove","path":"/metadata/annotations/service.beta.kubernetes.io~1azure-load-balancer-resource-group"},
            {"op":"remove","path":"/metadata/annotations/service.beta.kubernetes.io~1azure-pip-name"}
          ]' 2>/dev/null || true
          kubectl -n ${NS} set image deployment/liliput-api \
            api=$ACR_LOGIN_SERVER/liliput-api-${IMAGE_SUFFIX}:${{ github.sha }}
          kubectl -n ${NS} set image deployment/liliput-web \
            web=$ACR_LOGIN_SERVER/liliput-web-${IMAGE_SUFFIX}:${{ github.sha }}
          kubectl -n ${NS} rollout restart deployment/liliput-api

      - name: Wait for rollout
        run: |
          set +e
          kubectl -n ${NS} rollout status deployment/liliput-api --timeout=5m
          API_RC=$?
          kubectl -n ${NS} rollout status deployment/liliput-web --timeout=5m
          WEB_RC=$?
          kubectl -n ${NS} rollout status deployment/liliput-gateway --timeout=5m
          GW_RC=$?
          if [ $API_RC -ne 0 ] || [ $WEB_RC -ne 0 ] || [ $GW_RC -ne 0 ]; then
            echo "::group::Diagnostics"
            kubectl -n ${NS} get pods -o wide
            kubectl -n ${NS} get events --sort-by='.lastTimestamp' | tail -30
            kubectl -n ${NS} logs -l app=liliput-api --tail=50 2>/dev/null || true
            kubectl -n ${NS} logs -l app=liliput-web --tail=50 2>/dev/null || true
            kubectl -n ${NS} describe pod -l app=liliput-api 2>/dev/null | tail -40 || true
            kubectl -n ${NS} describe pod -l app=liliput-web 2>/dev/null | tail -40 || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Get service URL
        run: |
          {
            echo "### Liliput DEV Deployed ✅"
            echo ""
            echo "- **DEV URL: https://dev.liliput.crgarcia.com.ar**"
            echo "- Namespace: \`${NS}\`"
            echo "- Image tag: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
